[project]
name = "backfutbol"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.9.2",
    "fastapi[standard]>=0.162.0",
    "pymongo>=4.19.0",
]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
